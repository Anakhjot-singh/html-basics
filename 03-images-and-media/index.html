<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Images and Media</title>
</head>
<body>
  <h1>Images and Media</h1>

  <!-- Image: alt text helps screen readers and shows if the image fails -->
  <img src="https://picsum.photos/400/250" alt="Random sample photo" width="400">

  <!-- Figure groups an image with its caption -->
  <figure>
    <img src="https://picsum.photos/300/200" alt="Another sample photo" width="300">
    <figcaption>A figure with a caption</figcaption>
  </figure>

  <!-- Audio player (replace src with your own file) -->
  <audio controls>
    <source src="sound.mp3" type="audio/mpeg">
    Your browser does not support audio.
  </audio>

  <!-- Video player (replace src with your own file) -->
  <video controls width="400">
    <source src="clip.mp4" type="video/mp4">
    Your browser does not support video.
  </video>
</body>
</html>
