<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Text and Links</title>
</head>
<body>
  <!-- Headings: h1 is the most important, h6 the least -->
  <h1>Heading 1</h1>
  <h2>Heading 2</h2>
  <h3>Heading 3</h3>

  <!-- Paragraph -->
  <p>This is a paragraph with <strong>bold</strong>, <em>italic</em> and <mark>highlighted</mark> text.</p>

  <!-- Line break and horizontal line -->
  <p>First line<br>Second line</p>
  <hr>

  <!-- Link to another website (opens in a new tab) -->
  <a href="https://github.com" target="_blank" rel="noopener">Visit GitHub</a>

  <!-- Link to another page in this project -->
  <p><a href="../01-basic-structure/index.html">Go to Basic Structure</a></p>

  <!-- Link to a section on the same page -->
  <p><a href="#bottom">Jump to bottom</a></p>
  <p id="bottom">You reached the bottom.</p>
</body>
</html>
