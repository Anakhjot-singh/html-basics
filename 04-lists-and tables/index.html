<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lists and Tables</title>
  <style>
    /* Simple table styling so borders are visible */
    table, th, td { border: 1px solid #333; border-collapse: collapse; padding: 8px; }
    th { background: #eee; }
  </style>
</head>
<body>
  <h1>Lists and Tables</h1>

  <!-- Unordered list: bullet points -->
  <h2>Skills</h2>
  <ul>
    <li>HTML</li>
    <li>SQL</li>
    <li>Python</li>
  </ul>

  <!-- Ordered list: numbered steps -->
  <h2>Steps to publish a page</h2>
  <ol>
    <li>Write the code</li>
    <li>Push to GitHub</li>
    <li>Enable GitHub Pages</li>
  </ol>

  <!-- Description list: term and meaning -->
  <h2>Glossary</h2>
  <dl>
    <dt>HTML</dt>
    <dd>The structure of a web page</dd>
    <dt>CSS</dt>
    <dd>The styling of a web page</dd>
  </dl>

  <!-- Table: thead = header, tbody = body, tr = row, th/td = cells -->
  <h2>Marks</h2>
  <table>
    <thead>
      <tr><th>Subject</th><th>Score</th></tr>
    </thead>
    <tbody>
      <tr><td>Maths</td><td>90</td></tr>
      <tr><td>Science</td><td>85</td></tr>
    </tbody>
  </table>
</body>
</html>
