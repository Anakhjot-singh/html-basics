<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f4f6f8; color: #222; }
    header { background: #2b4acb; color: #fff; text-align: center; padding: 40px 16px; }
    header img { border-radius: 50%; border: 4px solid #fff; }
    main { max-width: 700px; margin: 20px auto; padding: 0 16px; }
    section { background: #fff; padding: 16px; margin-bottom: 16px; border-radius: 8px; }
    a { color: #2b4acb; }
  </style>
</head>
<body>
  <header>
    <img src="https://picsum.photos/120" alt="Profile photo" width="120" height="120">
    <h1>Your Name</h1>
    <p>Aspiring Data Analyst and Web Developer</p>
  </header>

  <main>
    <section>
      <h2>About Me</h2>
      <p>Write 2 to 3 lines about yourself, your goals and what you are learning.</p>
    </section>

    <section>
      <h2>Skills</h2>
      <ul>
        <li>HTML</li>
        <li>SQL</li>
        <li>Python</li>
        <li>Data Structures and Algorithms</li>
      </ul>
    </section>

    <section>
      <h2>Links</h2>
      <p>
        <a href="https://github.com/your-username" target="_blank" rel="noopener">GitHub</a> |
        <a href="mailto:you@example.com">Email</a>
      </p>
    </section>
  </main>

  <footer style="text-align:center; padding:16px;">
    <p>&copy; 2026 Your Name</p>
  </footer>
</body>
</html>
