<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forms</title>
</head>
<body>
  <h1>Registration Form</h1>

  <form action="#" method="post">
    <!-- label "for" matches the input "id" -->
    <label for="name">Name</label><br>
    <input type="text" id="name" name="name" required><br><br>

    <label for="email">Email</label><br>
    <input type="email" id="email" name="email" required><br><br>

    <label for="age">Age</label><br>
    <input type="number" id="age" name="age" min="1" max="100"><br><br>

    <!-- Radio buttons: same name, only one can be chosen -->
    <p>Gender</p>
    <input type="radio" id="m" name="gender" value="male">
    <label for="m">Male</label>
    <input type="radio" id="f" name="gender" value="female">
    <label for="f">Female</label><br><br>

    <!-- Checkboxes: many can be chosen -->
    <p>Interests</p>
    <input type="checkbox" id="web" name="interest" value="web">
    <label for="web">Web design</label>
    <input type="checkbox" id="data" name="interest" value="data">
    <label for="data">Data analysis</label><br><br>

    <!-- Dropdown -->
    <label for="country">Country</label><br>
    <select id="country" name="country">
      <option value="">Select</option>
      <option value="in">India</option>
      <option value="us">USA</option>
    </select><br><br>

    <!-- Multi-line text -->
    <label for="msg">Message</label><br>
    <textarea id="msg" name="msg" rows="4" cols="30"></textarea><br><br>

    <button type="submit">Submit</button>
    <button type="reset">Reset</button>
  </form>
</body>
</html>
